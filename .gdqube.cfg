[limits]
file_lines_soft = 200
file_lines_hard = 300
function_lines = 30
function_lines_critical = 60
max_parameters = 4
max_nesting = 3
cyclomatic_warning = 10
cyclomatic_critical = 15
god_class_functions = 20

[checks]
file_length = true
function_length = true
cyclomatic_complexity = true
god_class = true
parameters = true
nesting = true
todo_comments = true
print_statements = true
empty_functions = true
magic_numbers = true
commented_code = true
missing_types = true
missing_return_type = true
long_lines = true
naming_conventions = true
unused_variables = true
unused_parameters = true
respect_gdignore = true

[exclude]
paths = .godot/

# Per-file overrides (senior developer consensus 2026-01-10)
# Core orchestrators managing threading, physics, and rendering 
# legitimately require more space than typical files.
[file:scripts/chunk_manager.gd]
file_lines_hard = 1000

# False positive: Linter miscounts _init function length/complexity (counts to EOF)
[file:scenes/proto_controller/proto_input_handler.gd]
function_lines_critical = 100
cyclomatic_critical = 25

# False positive: Linter miscounts update_collision_radius length
[file:scripts/chunk/visibility_manager.gd]
function_lines_critical = 100
